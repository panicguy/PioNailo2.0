<!-- Native collapsed automation/chat structure and height coupling (game v1.240.1). -->
<style id="test-native-rail-css">
  :root { --mad:#543037; --mad-linha:#302335; --mad-luz2:#8f5964; --vao:#291e2e; --sobre-mad:#ffe3c0; }
  #test-rail-app { width:calc(100vw - 20px); display:grid; grid-template-columns:80px minmax(0,1fr) var(--col-dir,306px); gap:10px; }
  #test-rail-app .col { display:flex; flex-direction:column; gap:16px; min-width:0; }
  html.dir-min:not(.mobile) .app { --col-dir:54px; }
  html.dir-min:not(.mobile) .col.dir { gap:12px; overflow:visible; }
  .painel { box-sizing:border-box; border:0; border-radius:8px; padding:13px 15px 15px; background:var(--mad); box-shadow:inset 0 0 0 2px var(--mad-linha),0 6px 0 var(--mad-linha); flex:none; }
  html.dir-min:not(.mobile) #p-auto.recolhida, html.dir-min:not(.mobile) #p-chat.recolhida { padding:4px; height:44px; }
  @media(min-width:1281px) {
    html.dir-min:not(.mobile) #p-auto.recolhida, html.dir-min:not(.mobile) #p-chat.recolhida { height:calc((var(--menu-alt,82px) - 12px)/2); }
  }
  .painel-cab-auto { display:flex; height:100%; }
  html.dir-min:not(.mobile) .painel-cab h3 { display:none; }
  .btn-painel-toggle, .chat-min-btn { border:0; box-sizing:border-box; display:flex; align-items:center; justify-content:center; color:var(--sobre-mad); background:var(--vao); box-shadow:inset 0 0 0 2px var(--mad-linha); cursor:pointer; }
  html.dir-min:not(.mobile) #p-auto.recolhida .btn-painel-toggle, html.dir-min:not(.mobile) #p-chat.recolhida .chat-min-btn { position:relative; width:100%; height:100%; margin:0; border-radius:5px; }
  .painel-ico svg { width:17px; height:17px; display:block; }
  .painel-ico-selo { position:absolute; right:0; bottom:0; min-width:13px; padding:0 3px; border-radius:4px; background:var(--mad); color:white; font:700 8px/1.6 Tahoma; }
  .selo-novas { background:#68358c; }
  .hidden { display:none!important; }
  html.dir-min:not(.mobile) #p-chat.recolhida .chat-abas, html.dir-min:not(.mobile) #p-chat.recolhida .chat-ferramentas { display:block; height:100%; }
  html.dir-min:not(.mobile):not(.modo-imersivo) .palco-moldura { margin-right:calc(-1 * (var(--col-dir) + 10px)); }
  .palco-moldura { min-height:130px; background:#382435; color:white; padding:12px; box-sizing:border-box; }
</style>
<div class="app" id="test-rail-app">
  <aside class="col esq"></aside>
  <aside class="col dir">
    <div class="painel recolhida" id="p-auto"><div class="painel-cab painel-cab-auto">
      <h3>Automações</h3>
      <button type="button" id="btn-auto-toggle" class="btn-painel-toggle" aria-expanded="false" title="Expandir automações">
        <span class="painel-ico"><svg viewBox="0 0 24 24"><path d="M12 5V2L8 6l4 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z" fill="currentColor"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/></svg></span>
        <b class="painel-ico-selo" id="auto-cnt-rail">4/5</b>
      </button>
    </div></div>
    <div class="painel chat recolhida" id="p-chat"><div class="chat-abas"><div class="chat-ferramentas">
      <button type="button" id="btn-chat-toggle" class="chat-min-btn" aria-expanded="false" title="Expandir chat">
        <span class="painel-ico"><svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4V6a2 2 0 0 1 2-2z" fill="currentColor"/><circle cx="8" cy="11" r="1.3" fill="var(--vao)"/><circle cx="12" cy="11" r="1.3" fill="var(--vao)"/><circle cx="16" cy="11" r="1.3" fill="var(--vao)"/></svg></span>
        <b class="painel-ico-selo selo-novas" id="chat-cnt-rail">20</b>
      </button>
    </div></div></div>
  </aside>
</div>
