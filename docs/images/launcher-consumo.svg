<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
<title id="title">PIO Rebosteio — consumo por modo</title>
<desc id="desc">Comparação das médias de CPU e RAM transcritas da imagem fornecida pelo mantenedor. Normal: 38,4% e 3.323 MiB. Eco: 26,2% e 2.205 MiB. Só caça: 24,4% e 2.171 MiB. Batalha: 4,9% e 928 MiB. Headless: 6,1% e 560 MiB. As duas escalas são independentes e começam em zero.</desc>
<rect width="1120" height="540" rx="24" fill="#121525"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="40" y="48" fill="#c4b5fd" font-size="13" font-weight="700" letter-spacing="3">PIO REBOSTEIO / POR DENTRO DO CONSUMO</text>
<text x="40" y="93" fill="#f8fafc" font-size="32" font-weight="700">Cada modo, um ritmo de jogo.</text>
<text x="40" y="125" fill="#a5afc4" font-size="16">Compare as médias. Os picos estão na tabela logo abaixo.</text>
<path d="M40 151H1080" stroke="#30364a"/>
<text x="200" y="186" fill="#e2e8f0" font-size="15" font-weight="700">CPU MÉDIA</text>
<text x="650" y="186" fill="#e2e8f0" font-size="15" font-weight="700">RAM MÉDIA</text>
<text x="200" y="209" fill="#94a3b8" font-size="12">Escala: 0–40%</text>
